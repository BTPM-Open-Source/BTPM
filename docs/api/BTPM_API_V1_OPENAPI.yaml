components:
  securitySchemes:
    delegatedUserBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Bearer obtained through the approved delegated-user OAuth flow for an
        active BTPM Connected App. The token represents a real BTPM user and a
        signed OAuth client identity. BTPM Connected-App capabilities are
        evaluated server-side and are not OAuth scope strings.

  parameters:
    OffsetLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        maximum: 10000
        default: 0
    Search:
      name: search
      in: query
      required: false
      schema:
        type: string
        maxLength: 100
    IncludeArchived:
      name: include_archived
      in: query
      required: false
      description: Only literal `true` or `false` is accepted; default is false.
      schema:
        type: boolean
        default: false
    CursorLimit500:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    KpiUpdatesLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque base64url keyset cursor. Persist and replay exactly; do not edit or infer scope from it.
      schema:
        type: string
        minLength: 1
        maxLength: 512
        pattern: '^[A-Za-z0-9_-]+$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Reuse the same key for retries of the same canonical business mutation.
      schema:
        type: string
        minLength: 1
        maxLength: 255
        pattern: '^[A-Za-z0-9._~:@/+!=-]{1,255}$'
    XRequestId:
      name: X-Request-ID
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
    XCorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/NonNilUuid'
    LowercaseProjectId:
      name: projectId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/LowercaseNonNilUuid'
    ProgramId:
      name: programId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/NonNilUuid'
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/NonNilUuid'
    RiskId:
      name: riskId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/NonNilUuid'
    BlockerId:
      name: blockerId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/NonNilUuid'
    PhaseId:
      name: phaseId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/NonNilUuid'
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/NonNilUuid'
    PortfolioId:
      name: portfolioId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/NonNilUuid'
    KpiId:
      name: kpiId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/LowercaseNonNilUuid'

  responses:
    ReadObjectResponse:
      description: Authorized bounded domain object. Exact response projection is owned by the live delegated reader.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReadObject'
    ReadCollectionResponse:
      description: Authorized bounded collection. Pagination is route-specific as documented by its query parameters.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReadCollection'
    MutationResponse:
      description: Bounded canonical mutation result; may represent applied, replayed, no-change, or an explicitly modeled business outcome.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MutationResult'
    ErrorResponse:
      description: Bounded safe error. No raw SQL, token, service-role, stack-trace, or protected database details are exposed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:
    NonNilUuid:
      type: string
      format: uuid
      not:
        const: 00000000-0000-0000-0000-000000000000
    LowercaseNonNilUuid:
      allOf:
        - $ref: '#/components/schemas/NonNilUuid'
        - type: string
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    CalendarDate:
      type: string
      format: date
      pattern: '^\d{4}-\d{2}-\d{2}$'
    ConcurrencyTimestamp:
      type: string
      description: Timezone-aware PostgreSQL-compatible timestamptz obtained from an authoritative BTPM read and preserved verbatim.
      pattern: '^(\d{4})-(\d{2})-(\d{2})[Tt ](\d{2}):(\d{2}):(\d{2})(?:\.(\d{1,9}))?(Z|z|[+-]\d{2}(?::?\d{2})?)$'
    PmStatus:
      type: string
      enum: [planned, active, completed, on_hold, cancelled]
    Priority:
      type: string
      enum: [low, medium, high, critical]
    WorkItemType:
      type: string
      enum: [work_item, milestone, deliverable, decision, review]
    VersionPayload:
      type: object
      additionalProperties: false
      required: [service, apiVersion]
      properties:
        service:
          const: btpm-api
        apiVersion:
          const: v1
    CapabilitiesPayload:
      type: object
      additionalProperties: false
      required: [service, apiVersion, supportedOperations]
      properties:
        service:
          const: btpm-api
        apiVersion:
          const: v1
        supportedOperations:
          type: array
          minItems: 50
          maxItems: 50
          uniqueItems: true
          items:
            type: string
            enum:
              - version.get
              - capabilities.get
              - me.get
              - organizations.get
              - workspaces.get
              - programs.get
              - programs.get_by_id
              - projects.get
              - projects.get_by_id
              - projects.planning.get
              - execution_updates.append
              - risks.create
              - risks.update
              - blockers.create
              - blockers.update
              - phases.create
              - phases.update
              - phases.reorder
              - phases.plan
              - tasks.create
              - tasks.update
              - tasks.reorder
              - tasks.plan
              - tasks.assign
              - tasks.transition
              - risks.get
              - risks.get_by_id
              - blockers.get
              - blockers.get_by_id
              - execution_updates.get
              - phases.get_by_id
              - tasks.get_by_id
              - projects.create
              - projects.update
              - projects.transition
              - programs.create
              - programs.update
              - workspace_members.get
              - portfolios.get
              - portfolios.get_by_id
              - portfolios.projects.get
              - portfolios.create
              - portfolios.update
              - portfolios.assign_project
              - kpis.get
              - kpis.get_by_id
              - kpis.updates.get
              - kpis.create
              - kpis.update
              - kpis.updates.append
    ReadObject:
      type: object
      additionalProperties: true
      description: Conservative schema for a bounded authorized read projection; exact domain fields are defined by the live delegated reader.
    ReadCollection:
      type: object
      additionalProperties: true
      description: Conservative schema for a bounded authorized collection and its route-specific pagination metadata.
    MutationResult:
      type: object
      additionalProperties: true
      description: Conservative schema for the bounded mutation result. Request schemas below define the only accepted caller-controlled business fields.
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error, requestId]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - invalid_request
                - invalid_request_id
                - invalid_json
                - invalid_content_length
                - unsupported_media_type
                - request_too_large
                - cors_origin_denied
                - route_not_found
                - not_authorized
                - concurrency_conflict
                - idempotency_conflict
                - idempotency_pending
                - rate_limit_exceeded
                - api_unavailable
                - request_timeout
                - internal_error
            message:
              type: string
        requestId:
          type: string

    AppendExecutionUpdateRequest:
      type: object
      additionalProperties: false
      required: [targetType, targetId, summary, updateDate]
      properties:
        targetType:
          type: string
          enum: [phase, task]
        targetId:
          $ref: '#/components/schemas/NonNilUuid'
        summary:
          type: string
          minLength: 1
          maxLength: 4000
        updateDate:
          $ref: '#/components/schemas/CalendarDate'
        statusLabel:
          type: [string, 'null']
          maxLength: 255

    CreateRiskRequest:
      type: object
      additionalProperties: false
      required: [targetType, targetId, title]
      properties:
        targetType:
          type: string
          enum: [project, phase, task]
        targetId:
          $ref: '#/components/schemas/NonNilUuid'
        title:
          type: string
          minLength: 1
          maxLength: 500
        description:
          type: [string, 'null']
          maxLength: 4000
        mitigationPlan:
          type: [string, 'null']
          maxLength: 4000
        likelihood:
          type: string
          enum: [low, medium, high]
          default: medium
        impact:
          type: string
          enum: [low, medium, high, critical]
          default: medium
        status:
          type: string
          enum: [open, under_mitigation, monitoring, realized, closed]
          default: open
    UpdateRiskRequest:
      type: object
      additionalProperties: false
      required: [expectedUpdatedAt, title, description, mitigationPlan, likelihood, impact, status]
      properties:
        expectedUpdatedAt:
          $ref: '#/components/schemas/ConcurrencyTimestamp'
        title:
          type: string
          minLength: 1
          maxLength: 500
        description:
          type: [string, 'null']
          maxLength: 4000
        mitigationPlan:
          type: [string, 'null']
          maxLength: 4000
        likelihood:
          type: string
          enum: [low, medium, high]
        impact:
          type: string
          enum: [low, medium, high, critical]
        status:
          type: string
          enum: [open, under_mitigation, monitoring, realized, closed]

    CreateBlockerRequest:
      type: object
      additionalProperties: false
      required: [targetType, targetId, title]
      properties:
        targetType:
          type: string
          enum: [project, phase, task]
        targetId:
          $ref: '#/components/schemas/NonNilUuid'
        title:
          type: string
          minLength: 1
          maxLength: 500
        description:
          type: [string, 'null']
          maxLength: 4000
        severity:
          type: string
          enum: [low, medium, high, critical]
          default: medium
        status:
          type: string
          enum: [open, in_progress, resolved]
          default: open
    UpdateBlockerRequest:
      type: object
      additionalProperties: false
      required: [expectedUpdatedAt, title, description, severity, status]
      properties:
        expectedUpdatedAt:
          $ref: '#/components/schemas/ConcurrencyTimestamp'
        title:
          type: string
          minLength: 1
          maxLength: 500
        description:
          type: [string, 'null']
          maxLength: 4000
        severity:
          type: string
          enum: [low, medium, high, critical]
        status:
          type: string
          enum: [open, in_progress, resolved]

    CreatePhaseRequest:
      type: object
      additionalProperties: false
      required: [projectId, name]
      properties:
        projectId:
          $ref: '#/components/schemas/NonNilUuid'
        name:
          type: string
          minLength: 1
          maxLength: 500
        description:
          type: [string, 'null']
          maxLength: 4000
        status:
          $ref: '#/components/schemas/PmStatus'
        phaseType:
          $ref: '#/components/schemas/WorkItemType'
        startDate:
          oneOf:
            - $ref: '#/components/schemas/CalendarDate'
            - type: 'null'
        targetEndDate:
          oneOf:
            - $ref: '#/components/schemas/CalendarDate'
            - type: 'null'
        sortOrder:
          type: [integer, 'null']
          minimum: 0
          maximum: 100000
    UpdatePhaseRequest:
      type: object
      additionalProperties: false
      required: [expectedUpdatedAt, name, description, status, phaseType]
      properties:
        expectedUpdatedAt:
          $ref: '#/components/schemas/ConcurrencyTimestamp'
        name:
          type: string
          minLength: 1
          maxLength: 500
        description:
          type: [string, 'null']
          maxLength: 4000
        status:
          $ref: '#/components/schemas/PmStatus'
        phaseType:
          $ref: '#/components/schemas/WorkItemType'
    ReorderPhaseRow:
      type: object
      additionalProperties: false
      required: [phaseId, expectedUpdatedAt, sortOrder]
      properties:
        phaseId:
          $ref: '#/components/schemas/NonNilUuid'
        expectedUpdatedAt:
          $ref: '#/components/schemas/ConcurrencyTimestamp'
        sortOrder:
          type: integer
          minimum: 0
          maximum: 100000
    ReorderPhasesRequest:
      type: object
      additionalProperties: false
      required: [rows]
      properties:
        rows:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/ReorderPhaseRow'
    PlanPhaseRequest:
      type: object
      additionalProperties: false
