    post:
      tags: [Programs]
      operationId: programs.create
      summary: Create a Program in a Workspace.
      x-btpm-operation-class: mutation
      x-btpm-idempotency-required: true
      x-btpm-concurrency-required: false
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProgramRequest'
      responses:
        '200':
          $ref: '#/components/responses/MutationResponse'
        '201':
          $ref: '#/components/responses/MutationResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /v1/programs/{programId}:
    parameters:
      - $ref: '#/components/parameters/ProgramId'
    get:
      tags: [Programs]
      operationId: programs.get_by_id
