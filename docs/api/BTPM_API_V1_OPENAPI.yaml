openapi: 3.1.0
info:
  title: BTPM API v1
  version: 1.0.0
  description: |
    Machine-readable contract for the current BTPM REST API v1 surface.

    This specification was regenerated against repository source at
    df51012ac283de1dd901cb52a2eae1dba17d3cae and covers all 50 operationIds
    advertised by `supabase/functions/_shared/btpm-api/routes/capabilities.ts`.
    The live route allowlist and strict route/body parsers remain authoritative
    if implementation and generated documentation ever drift.

    Protected operations execute only as a delegated BTPM user through an
    active Connected App. BTPM does not expose client_credentials, static API
    keys, service-role credentials, or direct database credentials as supported
    integration identities. Connected-App capabilities are server-side BTPM
    grants, not OAuth scope strings.

    Request schemas are intentionally closed and mirror the live route parsers.
    Read/result schemas are intentionally conservative where the runtime returns
    bounded domain-specific payloads: integrators must not infer write authority
    from response fields not accepted by the corresponding request schema.
  x-btpm-operation-count: 50
  x-btpm-read-operation-count: 24
  x-btpm-mutation-operation-count: 26
  x-btpm-generated-against: df51012ac283de1dd901cb52a2eae1dba17d3cae
servers:
  - url: https://{supabaseProjectHost}/functions/v1/btpm-api-v1
    description: Deployment-specific BTPM Supabase Edge Function endpoint.
    variables:
      supabaseProjectHost:
        default: example.supabase.co
        description: Configure the actual BTPM environment host.
security:
  - delegatedUserBearer: []
tags:
  - name: Metadata
  - name: Identity
  - name: Directory
  - name: Programs
  - name: Projects
  - name: Workspace members
  - name: Execution updates
  - name: Risks
  - name: Blockers
  - name: Phases
  - name: Tasks
  - name: Portfolios
  - name: KPIs
paths:
  /v1/version:
    get:
      tags: [Metadata]
      operationId: version.get
      summary: Get API version metadata.
      security: []
      x-btpm-operation-class: read
      responses:
        '200':
          description: API version metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionPayload'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /v1/capabilities:
    get:
      tags: [Metadata]
      operationId: capabilities.get
      summary: Get the canonical v1 operation inventory.
      description: Advertises implementation support, not caller-specific authorization.
      security: []
      x-btpm-operation-class: read
      responses:
        '200':
          description: Current 50-operation v1 inventory.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilitiesPayload'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /v1/me:
    get:
      tags: [Identity]
      operationId: me.get
      summary: Resolve the delegated caller and optional context authority.
      description: |
        Accepts either no query parameters or exactly `contextType` and
        `contextId` together. Unknown or duplicate query parameters are rejected.
      x-btpm-operation-class: read
      parameters:
        - name: contextType
          in: query
          required: false
          schema:
            type: string
            enum: [organization, workspace, project]
        - name: contextId
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/NonNilUuid'
      responses:
        '200':
          $ref: '#/components/responses/ReadObjectResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /v1/organizations:
    get:
      tags: [Directory]
      operationId: organizations.get
      summary: List Organizations available to the delegated caller.
      x-btpm-operation-class: read
      parameters:
        - $ref: '#/components/parameters/OffsetLimit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          $ref: '#/components/responses/ReadCollectionResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /v1/workspaces:
    get:
      tags: [Directory]
      operationId: workspaces.get
      summary: List Workspaces in one Organization.
      description: The external Organization query key is exactly `organization_id`; camelCase aliases are rejected.
      x-btpm-operation-class: read
      parameters:
        - name: organization_id
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/NonNilUuid'
        - $ref: '#/components/parameters/OffsetLimit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          $ref: '#/components/responses/ReadCollectionResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /v1/programs:
    get:
      tags: [Programs]
      operationId: programs.get
      summary: List Programs in one Workspace.
      description: The external Workspace query key is exactly `workspace_id`; camelCase aliases are rejected.
      x-btpm-operation-class: read
      parameters:
        - name: workspace_id
