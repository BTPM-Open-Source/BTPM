      description: Project creation does not automatically enable the new Project for the Connected App.
      x-btpm-operation-class: mutation
      x-btpm-idempotency-required: true
      x-btpm-concurrency-required: false
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XRequestId'
